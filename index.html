function showWords(cat,q,pg){
  const W=S._wl=S._wl||{}; if(cat===undefined){ W.src="sel"; W.d=difSet()?[...difSet()]:["1","2","3","4","5"]; W.q=""; W.pg=0; }
  else { if(cat!==null) { W.src=cat; W.pg=0; } if(q!==undefined&&q!==null){ if(q!==W.q) W.pg=0; W.q=q; } if(pg!==undefined) W.pg=+pg; }
  const vis=VB(), selC=selCats(), src=W.src==="sel"?selC:W.src==="all"?vis:vis.filter(b=>b.key===W.src);
  const dset=new Set(W.d.length?W.d:["1","2","3","4","5"]), qq=normW(W.q||"");
  const list=src.flatMap(b=>(isCA()&&b.ca?b.ca:b.items).map((t,i)=>({t,d:b.dif[i],s:(b.side||"")[i],ic:b.icon}))).filter(x=>dset.has(x.d)&&(!qq||normW(x.t).includes(qq)));
  list.sort((a,b)=>a.t.localeCompare(b.t,"es"));
  const PER=150, pages=Math.max(1,Math.ceil(list.length/PER)); W.pg=Math.min(W.pg||0,pages-1);
  const shown=list.slice(W.pg*PER,(W.pg+1)*PER), many=src.length>1;
  const nav=pages>1?`<div class="pager">${Array.from({length:pages},(_,p)=>`<button class="${p===W.pg?"on":""}" onclick="showWords(null,null,${p})">${p+1}</button>`).join("")}</div>`:"";
  openModal(mHead("📋 Palabras")+`<div class="row" style="margin-bottom:8px"><select onchange="showWords(this.value)" aria-label="Qué categorías" style="flex:1">
      <option value="sel" ${W.src==="sel"?"selected":""}>✅ ${tr("Las de tu selección")} (${selC.length})</option>
      <option value="all" ${W.src==="all"?"selected":""}>📚 ${tr("Todas las categorías")} (${vis.length})</option>
      ${vis.map(x=>`<option value="${x.key}" ${x.key===W.src?"selected":""}>${x.icon} ${esc(L(x))}</option>`).join("")}</select></div>
    <div class="chips wdif">${["1","2","3","4","5"].map(k=>`<button class="mchip ${dset.has(k)&&W.d.length?"on":""}" onclick="wlDif('${k}')">${DIF_ICON[k]} ${DIFS[k]}</button>`).join("")}</div>
    <div class="addp" style="margin:8px 0 10px"><input type="text" id="wq" placeholder="Buscar palabra" value="${esc(W.q||"")}" oninput="clearTimeout(window.__wq);window.__wq=setTimeout(()=>{showWords(null,this.value);setTimeout(()=>{const x=$('wq');if(x){x.focus();x.setSelectionRange(x.value.length,x.value.length);}},0)},250)"></div>
    <p class="hint" style="margin-top:0">${fmt(list.length)} palabras · <span class="sd sa"></span> amarilla · <span class="sd sb"></span> azul</p>
    ${nav}<ul class="wlist notr">${shown.map(x=>`<li><span class="sd ${x.s==="b"?"sb":"sa"}"></span><span class="wt">${many?x.ic+" ":""}${cardTxt(x.t)}</span><i>${DIF_ICON[x.d]||""}</i></li>`).join("")}</ul>${nav}`);
}
function wlDif(k){ const W=S._wl; const s=new Set(W.d); if(s.has(k)) s.delete(k); else s.add(k); W.d=[...s].sort(); W.pg=0; showWords(null,null,0); }

function roundSummary(ri){

function computeAwards(){
  const H=S.history, P={}, A=[];
  H.forEach(h=>{ const k=h.player+"|"+h.team; P[k]=P[k]||{n:h.player,t:h.team,ok:0,turns:0,fouls:0,passes:0}; const p=P[k]; p.ok+=h.ok.length; p.turns++; p.fouls+=h.fouls||0; p.passes+=h.passed||0; });
  const ps=Object.values(P); if(!ps.length) return A;
  const top=(arr,f)=>arr.reduce((a,b)=>f(b)>f(a)?b:a);
  const bd=top(ps,p=>p.ok); A.push({e:"🎯",t:"Mejor descriptor",w:bd.n,team:bd.t,desc:bd.n,guess:mates(bd.t,bd.n),d:`${bd.ok} cartas acertadas cuando le tocaba describir`});
  const bt=top(H,h=>h.ok.length); A.push({e:"🚀",t:"El turno de la noche",w:bt.player,team:bt.team,desc:bt.player,guess:mates(bt.team,bt.player),d:`${bt.ok.length} cartas en un solo turno, en la ronda ${bt.round+1}`});

  updateAmbient();
  splash();
  if(S.phase==="ready"&&started){ const key=S.roundIdx+"-"+S.history.length; if(key!==lastSpoken){ lastSpoken=key; const tm=team(S.teamTurn); setTimeout(()=>speak(`Le toca a ${currentPlayer()}, de los ${an(tm.animal)}`),250); } }
}
document.addEventListener("keydown",e=>{
  const tag=(e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea"||tag==="select") return;
  if($("modal").innerHTML){ if(e.key==="Escape") closeModal(); return; }
  if(S.phase==="turn"){
    if(e.key===" "||e.key==="Enter"){ e.preventDefault(); if(S.turn.paused) togglePause(); else hit(); }
    else if(e.key==="p"||e.key==="P"){ e.preventDefault(); pass(); }
    else if(e.key==="f"||e.key==="F"){ e.preventDefault(); foul(); }
    else if(e.key==="z"||e.key==="Z"||e.key==="Backspace"){ e.preventDefault(); undoTap(); }
    else if(e.key==="Escape"){ e.preventDefault(); togglePause(); }
  } else if(S.phase==="ready"&&e.key==="Enter"){ e.preventDefault(); startTurn(); }
});
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){ if(S.phase==="turn"&&S.turn&&!S.turn.paused&&!S.turn.cdOn) togglePause(); save(); }
  else { if(started) keepAwake(); if(S.phase==="turn"&&S.turn&&S.turn.paused) toast("Turno en pausa: pulsa Seguir cuando estéis listos"); }
});
const inGameNow=()=>!["setup","end"].includes(S.phase);
window.addEventListener("beforeunload",e=>{ save(); if(inGameNow()){ e.preventDefault(); e.returnValue=""; } });
window.addEventListener("pagehide",()=>save());
window.addEventListener("popstate",()=>{ try{ history.pushState({tu:1},""); }catch(e){} if(S.phase==="turn"&&S.turn&&!S.turn.paused&&!S.turn.cdOn) togglePause(); if(inGameNow()) toast("Para salir de la partida, usa el menú ☰"); });
document.addEventListener("contextmenu",e=>{ const tag=(e.target.tagName||"").toLowerCase(); if(tag!=="input"&&tag!=="textarea") e.preventDefault(); });
window.addEventListener("storage",e=>{ if(e.key===KEY&&e.newValue&&!$("othertab")){ const d=document.createElement("div"); d.id="othertab"; d.className="overlay"; d.innerHTML=`<div class="modal" role="alertdialog"><h2>⚠️ Abierto en otra pestaña</h2><p>Este juego también está abierto en otra pestaña o ventana de este dispositivo y los cambios se están mezclando. Usadlo solo en una.</p><div class="menu"><button class="btn primary" onclick="useThisTab()">Seguir en esta pestaña</button></div></div>`; document.body.appendChild(d); if(S.phase==="turn"&&S.turn&&!S.turn.paused) togglePause(); } });
function useThisTab(){ const l=load(); if(l) S=l; const d=$("othertab"); if(d) d.remove(); save(); render(); }
if(S.locked&&(classExpired()||S.phase==="end")) clearClass();
if(/^c[A-Za-z0-9_-]{15,}$/.test(HASH_CODE)&&decodeCode(HASH_CODE.slice(1))){ if(!S.locked||S.locked.code!==HASH_CODE.slice(1)){ S.pendingJoin=HASH_CODE.slice(1); save(); } }
render();

</script>
</body>
