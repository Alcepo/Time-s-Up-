<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a3bd1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Time’s Up casero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8eefc; --ink:#141b3d; --muted:#525c86; --surface:#ffffff; --surface-2:#f3f6ff; --line:#c8d2ef;
  --accent:#2a3bd1; --accent-ink:#ffffff; --ok:#1d8f4e; --no:#c3362b; --pass:#5a6391;
  --card-bg:#fffdf7; --card-ink:#141b3d; --yellow:#f2b705; --blue:#2f7de1; --own:#7a4fd1;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1230; --ink:#eceffe; --muted:#a2aad2; --surface:#161e45; --surface-2:#1c2552; --line:#2c3769;
    --accent:#8e9dff; --accent-ink:#0d1230; --ok:#24a862; --no:#e0473b; --pass:#59628f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1230; --ink:#eceffe; --muted:#a2aad2; --surface:#161e45; --surface-2:#1c2552; --line:#2c3769;
  --accent:#8e9dff; --accent-ink:#0d1230; --ok:#24a862; --no:#e0473b; --pass:#59628f; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
html,body{overscroll-behavior:none}
body{touch-action:manipulation;margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:12px 14px 120px}

.btn{appearance:none;border:2px solid var(--ink);background:var(--surface);color:var(--ink);padding:12px 18px;min-height:48px;border-radius:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{font-family:var(--display);font-size:1.45rem;padding:16px 28px;min-height:64px;border-radius:18px}
.btn.full{width:100%}
.btn.small{padding:6px 12px;min-height:40px;font-size:.92rem;border-width:1.5px;border-radius:10px}
.btn.ghost{border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.icon-btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;min-width:40px;height:40px;cursor:pointer;display:inline-grid;place-items:center;padding:0 6px}

.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--surface);border-bottom:2px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--surface)}
.topbar .brand{font-family:var(--display);font-weight:800;font-size:1.2rem;margin-right:auto}

.hero{padding:18px 2px 6px}
.hero h1{font-size:clamp(2.3rem,10vw,4rem);font-weight:800;letter-spacing:-.02em}
.hero p{color:var(--muted);margin:8px 0 0;max-width:60ch}

details.block{background:var(--surface);border:2px solid var(--line);border-radius:18px;margin-top:14px;overflow:hidden}
details.block > summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;gap:12px}
details.block > summary::-webkit-details-marker{display:none}
details.block > summary h2{font-size:1.35rem;flex:1}
details.block > summary .st{color:var(--muted);font-size:.92rem;text-align:right}
details.block > summary::after{content:"＋";font-weight:800;font-size:1.2rem}
details.block[open] > summary::after{content:"−"}
.bbody{padding:0 18px 18px}
.sub{color:var(--muted);margin:0 0 14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
label.field{display:flex;flex-direction:column;gap:6px;font-weight:700}
label.field small{font-weight:400;color:var(--muted)}
input[type=text],input[type=number],textarea,select{background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-height:46px}
textarea{min-height:110px;resize:vertical}
input[type=number]{max-width:120px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
.stepper{display:inline-flex;align-items:center;gap:12px}
.stepper b{font-family:var(--display);font-size:1.7rem;min-width:1.5ch;text-align:center}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:14px}
.team{border:2px solid var(--tc);border-radius:16px;padding:12px;background:var(--surface-2);position:relative}
.team::before{content:"";position:absolute;inset:0 0 auto;height:8px;border-radius:14px 14px 0 0;background:var(--tc)}
.team-head{display:flex;gap:6px;align-items:center;margin-top:6px}
.team-head input{font-family:var(--display);font-weight:700}
.swatches{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.sw.on{border-color:var(--ink)}
.plist{margin:0;padding:0 0 0 22px;display:flex;flex-direction:column;gap:6px}
.pl{display:flex;align-items:center;gap:5px}
.pl span{flex:1;font-weight:700;overflow-wrap:anywhere}
.pl select{width:auto;min-height:40px;padding:4px 6px;font-size:.85rem}
.addp{display:flex;gap:6px;margin-top:10px}
.perlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.per{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:6px 8px 6px 12px;background:var(--surface-2);font-weight:700}
.per span{flex:1;overflow-wrap:anywhere}
.per input{width:72px}
.empty{color:var(--muted);font-style:italic;margin:4px 0}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.cat{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;padding:10px 12px;min-height:56px;cursor:pointer;background:var(--surface-2);font-weight:700;line-height:1.2}
.cat small{display:block;font-weight:400;color:var(--muted);font-size:.82rem}
.cat.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface-2))}
.cat.adult{border-style:dashed;border-color:var(--no);margin-top:12px}
.cat.adult.on{border-style:solid}
.rounds{display:flex;flex-direction:column;gap:10px}
.round{border:1.5px solid var(--line);border-radius:14px;padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.round.off{opacity:.55}
.round .rh{display:flex;gap:8px;align-items:center}
.round .num{font-family:var(--display);font-weight:800;font-size:1.6rem;width:1.4ch}
.round textarea{min-height:60px}
.inline{display:flex;align-items:center;gap:10px;font-weight:700;min-height:44px}
.badge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:.82rem;font-weight:700;background:color-mix(in srgb,var(--ok) 18%,var(--surface));color:var(--ink)}
.badge.mod{background:color-mix(in srgb,var(--yellow) 30%,var(--surface))}
.errors{background:color-mix(in srgb,var(--no) 14%,var(--surface));border:2px solid var(--no);border-radius:14px;padding:12px 16px;margin-top:14px}
.errors ul{margin:6px 0 0;padding-left:20px}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:2px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center}
.bottombar .btn{flex:1;max-width:520px}

.stage{min-height:calc(100vh - 64px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 16px 120px}
.round-tag{font-family:var(--display);font-weight:700;font-size:1.15rem;margin:0}
.rule{color:var(--muted);max-width:46ch;margin:6px auto 0}
.team-pill{display:inline-block;background:var(--tc);color:#fff;font-weight:700;border-radius:999px;padding:6px 16px}
.who h2{font-size:clamp(2.8rem,13vw,6rem);font-weight:800;letter-spacing:-.025em;margin-top:12px;overflow-wrap:anywhere}
.who h2 span{color:var(--tc)}
.guessers{color:var(--muted);margin:8px 0 0}
.carry{background:color-mix(in srgb,var(--tc) 16%,var(--surface));border-radius:12px;padding:8px 14px;font-weight:700;display:inline-block;margin-top:10px}
.facts{display:flex;gap:30px;justify-content:center;margin:18px 0 22px}
.facts div{display:flex;flex-direction:column}
.facts b{font-family:var(--display);font-size:2.2rem;line-height:1}
.facts span{color:var(--muted);font-size:.9rem}
.hint{color:var(--muted);font-size:.92rem;margin-top:10px}

.scroll{overflow-x:auto;max-width:100%}
table.score{border-collapse:collapse;margin:10px auto;min-width:300px}
table.score th,table.score td{padding:8px 10px;text-align:center;border-bottom:1.5px solid var(--line)}
table.score th:first-child,table.score td:first-child{text-align:left}
table.score td.tot{font-family:var(--display);font-weight:800;font-size:1.3rem}
.tname{display:flex;align-items:center;gap:8px;font-weight:700}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.mini-score{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:24px}
.mini-score div{border:2px solid var(--line);border-radius:12px;padding:6px 12px;display:flex;align-items:center;gap:8px;background:var(--surface)}
.mini-score b{font-family:var(--display);font-size:1.25rem}

/* Turno: solo lo justo */
.turn{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;padding:max(10px,env(safe-area-inset-top,0px)) 12px max(12px,env(safe-area-inset-bottom,0px));background:var(--bg);user-select:none;-webkit-user-select:none}
.drain{position:absolute;left:0;right:0;bottom:0;background:var(--tc);opacity:.22;transition:height .12s linear;pointer-events:none}
.turn > *:not(.drain){position:relative}
.t-head{display:grid;grid-template-columns:64px 1fr 64px;align-items:center}
.pause-btn{width:56px;height:56px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:1.1rem;cursor:pointer}
.tnum{font-family:var(--display);font-weight:800;font-size:clamp(3.6rem,17vw,7rem);line-height:.9;text-align:center;font-variant-numeric:tabular-nums;color:var(--tc)}
.tnum.urgent{color:var(--no);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.t-left{text-align:center;line-height:1.1}
.t-left b{font-family:var(--display);font-size:1.6rem;display:block}
.t-left span{font-size:.78rem;color:var(--muted)}
.cardzone{flex:1;display:grid;place-items:center;padding:10px 0;min-height:0}
.card{background:var(--card-bg);color:var(--card-ink);width:min(640px,100%);min-height:min(320px,38vh);border-radius:26px;display:flex;align-items:center;justify-content:center;padding:40px 20px 24px;position:relative;box-shadow:0 2px 0 #0002,0 18px 40px -18px #0006;animation:deal .2s ease-out}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:22px;border-radius:26px 26px 0 0;background:var(--cc)}
.ctext{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,11vw,5rem);line-height:1.05;text-align:center;margin:0;overflow-wrap:anywhere;letter-spacing:-.015em}
.ctext.m{font-size:clamp(2rem,8.5vw,4rem)}
.ctext.l{font-size:clamp(1.6rem,6.5vw,3.1rem)}
@keyframes deal{from{transform:translateY(14px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.t-info{text-align:center;color:var(--muted);font-size:.92rem;margin:0 0 10px}
.actions{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"pass foul" "ok ok";gap:10px;max-width:760px;width:100%;margin:0 auto}
.actions button{border:none;border-radius:20px;font-family:var(--display);font-weight:800;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.actions .b-ok{grid-area:ok;background:var(--ok);font-size:2rem;min-height:min(120px,16vh)}
.actions .b-pass{grid-area:pass;background:var(--pass);font-size:1.4rem;min-height:min(84px,11vh)}
.actions .b-foul{grid-area:foul;background:var(--no);font-size:1.4rem;min-height:min(84px,11vh)}
.actions button:disabled{opacity:.35}
.actions button:active:not(:disabled){transform:scale(.98)}
.pause{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:5;text-align:center;padding:24px}
.pause h2{font-size:3rem}
.pause .btn{width:min(380px,100%)}

/* Voto de color */
.vote{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:640px;margin:20px 0}
.vote button{border:none;border-radius:24px;min-height:min(260px,34vh);font-family:var(--display);font-weight:800;font-size:1.8rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.vote .va{background:var(--yellow);color:#2b2100}
.vote .vb{background:var(--blue);color:#fff}
.vote b{font-size:3.4rem;line-height:1}

/* Mazo */
.decklist{list-style:none;padding:0;margin:14px 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.decklist li{display:flex;align-items:center;gap:10px;background:var(--card-bg);color:var(--card-ink);border-radius:14px;padding:10px 10px 10px 18px;position:relative;min-height:60px}
.decklist li::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;border-radius:14px 0 0 14px;background:var(--cc)}
.decklist b{flex:1;font-family:var(--display);font-size:1.1rem;line-height:1.15}
.decklist button{background:transparent;border:1.5px solid #b9c3e6;color:var(--card-ink);border-radius:10px;min-height:40px;padding:0 12px;cursor:pointer;font-weight:700}

/* Revisión */
.review-list{list-style:none;padding:0;margin:16px auto;max-width:600px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.review-list li{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 10px 8px 18px;position:relative;min-height:62px}
.review-list li::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;border-radius:12px 0 0 12px;background:var(--cc)}
.review-list .rt{flex:1}
.review-list .rt b{font-family:var(--display);font-size:1.15rem}
.review-list .rt small{display:block;color:var(--muted)}
.toggle{border:2px solid var(--ok);background:var(--ok);color:#fff;border-radius:12px;min-height:46px;padding:0 12px;font-weight:700;cursor:pointer;min-width:124px}
.toggle[aria-pressed="false"]{background:transparent;color:var(--no);border-color:var(--no)}

/* Escribir cartas */
.writebox{width:100%;max-width:480px;display:flex;flex-direction:column;gap:10px;margin:16px 0}

.winner{font-size:clamp(2.8rem,13vw,6.5rem);font-weight:800;color:var(--tc);letter-spacing:-.03em;margin:6px 0;overflow-wrap:anywhere}
.stats-list{list-style:none;padding:0;margin:10px auto;max-width:420px;width:100%;text-align:left}
.stats-list li{display:flex;justify-content:space-between;border-bottom:1.5px solid var(--line);padding:8px 2px}

.overlay{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{background:var(--surface);color:var(--ink);border-radius:22px 22px 0 0;max-width:680px;width:100%;max-height:88vh;overflow:auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.overlay{align-items:center;padding:16px}.modal{border-radius:22px}}
.modal h2{font-size:1.6rem}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.menu{display:flex;flex-direction:column;gap:8px}
.menu .btn{justify-content:flex-start;width:100%}
.hist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.hist li{border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;border-left:7px solid var(--tc)}
.hist small{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;z-index:60;max-width:90vw;text-align:center}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

/* Mesa visual */
.mesa{position:relative;width:min(100%,520px);aspect-ratio:1;margin:8px auto 4px}
.mesa::before{content:"";position:absolute;inset:13%;border-radius:50%;background:radial-gradient(circle,var(--surface-2),var(--surface));border:2px dashed var(--line)}
.mesa-centro{position:absolute;inset:26%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;color:var(--muted);font-size:.88rem;line-height:1.25}
.mesa-centro b{font-family:var(--display);font-size:1.25rem;color:var(--ink)}
.seat{position:absolute;transform:translate(-50%,-50%);width:clamp(66px,19%,92px);display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;cursor:pointer;padding:0;color:var(--ink)}
.seat .av{width:clamp(50px,14vw,66px);height:clamp(50px,14vw,66px);border-radius:50%;background:var(--surface);border:3px solid var(--line);display:grid;place-items:center;font-size:clamp(1.5rem,6vw,2rem);position:relative;box-shadow:0 4px 10px -6px #0007}
.seat .av i{position:absolute;top:-6px;right:-6px;font-style:normal;background:var(--ink);color:var(--bg);font-size:.72rem;font-weight:700;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;padding:0 5px}
.seat .nm{font-weight:700;font-size:.85rem;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:1px 7px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat.sel .av{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 35%,transparent)}
.selpanel{background:color-mix(in srgb,var(--accent) 12%,var(--surface));border:2px solid var(--accent);border-radius:14px;padding:12px;margin:10px 0;display:flex;flex-direction:column;gap:8px}
.legend{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.lteam{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:14px;padding:8px 10px;background:var(--surface-2)}
.lteam .em{font-size:1.8rem;width:52px;height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer}
.lteam .info{flex:1;line-height:1.3}
.lteam .info b{font-family:var(--display)}
.lteam .info small{display:block;color:var(--muted)}
/* Manos */
.hand{list-style:none;padding:0;margin:14px 0;display:flex;flex-direction:column;gap:8px;width:100%;max-width:560px;text-align:left}
.hcard{display:grid;grid-template-columns:1fr 1fr;background:var(--card-bg);color:var(--card-ink);border-radius:16px;overflow:hidden;box-shadow:0 6px 16px -10px #0007}
.hcard div{padding:12px 12px 12px 16px;position:relative;font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1.15;min-height:64px;display:flex;flex-direction:column;justify-content:center}
.hcard div::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px}
.hcard .fa::before{background:var(--yellow)}
.hcard .fb::before{background:var(--blue)}
.hcard .fb{border-left:1.5px solid #e2e6f3}
.hcard small,.dcard small{font-family:var(--body);font-weight:400;font-size:.75rem;color:#5d668f}
.dcard{display:flex;align-items:center;gap:12px;background:var(--card-bg);color:var(--card-ink);border-radius:16px;padding:12px 14px 12px 20px;position:relative;min-height:66px;cursor:pointer;border:3px solid transparent;width:100%;text-align:left}
.dcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;border-radius:13px 0 0 13px;background:var(--cc)}
.dcard b{flex:1;font-family:var(--display);font-size:1.15rem;line-height:1.15}
.dcard .mk{font-weight:700;font-size:.85rem;color:#5d668f}

.opts{display:flex;flex-direction:column;gap:8px}

.order{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:4px}

.swp{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;min-width:38px;height:34px;cursor:pointer;font-weight:800}
.updown{display:flex;flex-direction:column;gap:4px}
.vbtn{flex:1;border:none}
.vbtn.va{background:var(--yellow);color:#2b2100}
.vbtn.vb{background:var(--blue);color:#fff}

.op .opx{border:none;background:none;color:var(--muted);cursor:pointer;font-size:.85rem;padding:2px 4px;min-width:24px;min-height:24px}

/* Final con suspense */

.pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}

.reveal{position:relative;min-height:5rem;display:grid;place-items:center;margin:16px 0 6px;width:100%}
.reveal .q{font-family:var(--display);font-weight:800;font-size:4.5rem;color:var(--muted);animation:shake .25s linear infinite}

.reveal.show .q{display:none}
.reveal.show .ans{animation:boom .55s cubic-bezier(.2,1.7,.4,1) forwards}
@keyframes shake{25%{transform:translateX(-4px) rotate(-3deg)}75%{transform:translateX(4px) rotate(3deg)}}

.podium{width:100%;max-width:620px;display:flex;flex-direction:column-reverse;gap:12px;margin:18px 0}

.prow.pin{animation:slidein .4s ease-out}

@keyframes slidein{from{transform:translateX(-30px);opacity:0}}
@keyframes winpop{from{transform:scale(.6);opacity:0}}
.suspense{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,7vw,2.6rem);min-height:1.3em;opacity:0;transition:opacity .4s}
.suspense.show{opacity:1}
.rchart{display:flex;gap:14px;justify-content:center;width:100%;max-width:640px;margin:6px 0 10px}
.rcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}

.cdpop{animation:cdpop .75s ease-out}

.stile{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.stile:nth-child(2){animation-delay:.05s}.stile:nth-child(3){animation-delay:.1s}.stile:nth-child(4){animation-delay:.15s}.stile:nth-child(5){animation-delay:.2s}.stile:nth-child(6){animation-delay:.25s}.stile:nth-child(7){animation-delay:.3s}.stile:nth-child(8){animation-delay:.35s}.stile:nth-child(9){animation-delay:.4s}.stile:nth-child(10){animation-delay:.45s}

function openSec(k){ S.open=S.open===k?"":k; save(); render(); }
function redistribute(k,random){
  const order=seats().map(s=>S.teams[s.t].players[s.j]);
  const names=random?shuffle(order):order;
  const freeAnimal=()=>{ const used=S.teams.map(t=>t.animal); const free=ANIMALS.map((a,i)=>i).filter(i=>!used.includes(i)); return free[Math.floor(Math.random()*free.length)]; };
  while(S.teams.length<k) S.teams.push(mkTeam(freeAnimal()));
  while(S.teams.length>k) S.teams.pop();
  if(random){ const pick=shuffle(ANIMALS.map((a,i)=>i)); S.teams.forEach((t,i)=>t.animal=pick[i]); }
  S.teams.forEach(t=>{ t.players=[]; t.next=0; });
  names.forEach((n,i)=>S.teams[i%k].players.push(n));
  S.sel=null;
}
function teamCount(d){
  const k=S.teams.length+d;
  if(k<2||k>MAX_TEAMS){ toast(k>MAX_TEAMS?`Máximo ${MAX_TEAMS} equipos`:"Mínimo 2 equipos"); return; }
  redistribute(k,false); save(); render();
}
function shuffleTeams(){ if(allPlayers().length<4){ toast("Añade al menos 4 jugadores"); return; } redistribute(S.teams.length,true); S.drawn=true; save(); render(); toast("Equipos sorteados"); }
function manualTable(){ if(allPlayers().length<4){ toast("Añade al menos 4 jugadores"); return; } redistribute(S.teams.length,false); S.drawn=true; save(); render(); toast("Mesa en el orden de la lista: tocad dos jugadores para intercambiarlos"); }
function editPlayers(){ S.drawn=false; S.sel=null; save(); render(); }
function clearPlayers(){ if(!confirm("¿Quitar a todos los jugadores?")) return; S.teams.forEach(t=>{t.players=[];t.next=0;}); S.drawn=false; S.sel=null; save(); render(); }
function removeAt(t,j){ S.teams[t].players.splice(j,1); S.sel=null; save(); render(); }
function swapWithin(t,j){ const p=S.teams[t].players; if(j+1>=p.length) return; [p[j],p[j+1]]=[p[j+1],p[j]]; S.sel=null; save(); render(); }
function removeName(n){ S.teams.forEach(t=>{ const i=t.players.indexOf(n); if(i>=0) t.players.splice(i,1); }); save(); render(); }
function shuffleTeamOrder(){ S.teams=shuffle(S.teams); S.sel=null; save(); render(); toast("Orden de equipos sorteado"); }
function shuffleWithin(){ S.teams.forEach(t=>t.players=shuffle(t.players)); S.sel=null; save(); render(); toast("Orden dentro de cada equipo sorteado"); }
const HIST_KEY="timesup-casero-historial";
function normName(n){ return String(n).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim(); }
function loadHist(){ try{ const h=JSON.parse(localStorage.getItem(HIST_KEY)); if(h&&h.people&&h.games) return h; }catch(e){} return {people:{},games:[]}; }
function saveHist(h){ try{ localStorage.setItem(HIST_KEY,JSON.stringify(h)); }catch(e){} }
function rememberPeople(names){ const h=loadHist(); names.forEach(n=>{ const k=normName(n); if(k&&!h.people[k]) h.people[k]=n; }); saveHist(h); }
function recordGame(){
  if(S.recorded||!S.history.length) return; S.recorded=true;
  const h=loadHist(), tot=totals(), max=Math.max(...tot), per={};
  S.history.forEach(x=>{ const k=normName(x.player); per[k]=per[k]||{ok:0,turns:0}; per[k].ok+=x.ok.length; per[k].turns++; });
  const players=[]; S.teams.forEach((t,i)=>t.players.forEach(p=>{ const k=normName(p); if(!h.people[k]) h.people[k]=p; players.push({k,team:i,ok:per[k]?.ok||0,turns:per[k]?.turns||0}); }));
  h.games.push({d:Date.now(),teams:S.teams.map((t,i)=>({a:t.animal,s:tot[i]})),win:tot.map((v,i)=>i).filter(i=>tot[i]===max),players});
  if(h.games.length>500) h.games.shift(); saveHist(h);
}
function rankingRows(){
  const h=loadHist(), R={};
  Object.entries(h.people).forEach(([k,n])=>R[k]={k,n,g:0,w:0,ok:0,turns:0});
  h.games.forEach(g=>g.players.forEach(p=>{ const r=R[p.k]; if(!r) return; r.g++; if(g.win.includes(p.team)) r.w++; r.ok+=p.ok; r.turns+=p.turns; }));
  return {h,rows:Object.values(R).sort((a,b)=>b.w-a.w||(b.w/(b.g||1))-(a.w/(a.g||1))||b.ok-a.ok||a.n.localeCompare(b.n))};
}
function showRanking(){
  const {h,rows}=rankingRows(), medal=["🥇","🥈","🥉"];
  const played=rows.filter(r=>r.g);
  const recent=[...h.games].reverse().slice(0,8);
  openModal(mHead("🏆 Ranking del grupo")+(played.length?`
    <p class="sub">${h.games.length} partida${h.games.length===1?"":"s"} guardada${h.games.length===1?"":"s"} en este dispositivo.</p>
    <div class="scroll"><table class="score rank"><thead><tr><th></th><th>Jugador</th><th>Partidas</th><th>Victorias</th><th>%</th><th>Cartas</th><th>Por turno</th></tr></thead><tbody>
    ${played.map((r,i)=>`<tr><td>${medal[i]||i+1}</td><td><b>${esc(r.n)}</b></td><td>${r.g}</td><td>${r.w}</td><td>${Math.round(r.w/r.g*100)}%</td><td>${r.ok}</td><td>${r.turns?(r.ok/r.turns).toFixed(1):"–"}</td></tr>`).join("")}
    </tbody></table></div>
    <h3 class="mini-h">Últimas partidas</h3>
    <ul class="hist">${recent.map(g=>{ const wn=g.win.map(i=>{ const t=g.teams[i]; const ps=g.players.filter(p=>p.team===i).map(p=>esc(h.people[p.k]||"?")).join(isCA()?" i ":" y "); return `${ANIMALS[t.a]?ANIMALS[t.a].e:""} ${ps}`; }).join(" / ");
      return `<li style="--tc:var(--accent)"><b>${new Date(g.d).toLocaleDateString(isCA()?"ca-ES":"es-ES",{day:"numeric",month:"short",year:"numeric"})}</b>: ${g.win.length>1?"empate de":"ganaron"} ${wn} <small>(${Math.max(...g.teams.map(t=>t.s))} puntos)</small></li>`; }).join("")}</ul>`
    :`<p class="empty">Todavía no hay partidas terminadas en este dispositivo.</p>`)+`
    <h3 class="mini-h">Personas guardadas</h3>
    <p class="sub">Se escriben igual aunque cambien mayúsculas o acentos. Toca ✕ para borrar a alguien y todos sus datos.</p>
    <div class="chips">${rows.length?rows.map(r=>`<span class="pchip">${esc(r.n)}<button aria-label="Borrar a ${esc(r.n)}" onclick="delPerson('${r.k.replace(/'/g,"\\'")}')">✕</button></span>`).join(""):`<p class="empty">Nadie todavía.</p>`}</div>
    <div class="menu" style="margin-top:16px">
      <button class="btn" onclick="clearGames()" ${h.games.length?"":"disabled"}>🗑️ Borrar las partidas (mantener las personas)</button>
      <button class="btn ghost" onclick="clearHist()">🗑️ Borrar todo el historial</button>
    </div>`);
}
function delPerson(k){ const h=loadHist(); if(!confirm(`¿Borrar a ${h.people[k]||k} y todas sus estadísticas?`)) return; delete h.people[k]; h.games.forEach(g=>g.players=g.players.filter(p=>p.k!==k)); saveHist(h); showRanking(); render(); }
function clearGames(){ if(!confirm("¿Borrar todas las partidas guardadas? Las personas se mantienen.")) return; const h=loadHist(); h.games=[]; saveHist(h); showRanking(); }

function addKnown(n){ $("newp").value=n; addPlayers(); }
function addPlayers(){
  const inp=$("newp"); const names=inp.value.split(/[,\n]/).map(s=>s.trim()).filter(Boolean);
  if(!names.length) return;
  for(const n of names){
    if(allPlayers().length>=MAX_PLAYERS){ toast(`Máximo ${MAX_PLAYERS} jugadores`); break; }
    if(allPlayers().some(p=>normName(p)===normName(n))){ toast(`${n} ya está en la mesa`); continue; }
    const known=loadHist().people[normName(n)], nm=known||n;
    let best=0; S.teams.forEach((t,i)=>{ if(t.players.length<S.teams[best].players.length) best=i; });
    S.teams[best].players.push(nm); rememberPeople([nm]);
  }
  if(S.drawn){ S.drawn=false; toast("Jugador añadido: vuelve a formar la mesa"); }
  save(); render(); setTimeout(()=>{ const x=$("newp"); if(x) x.focus(); },0);
}
function tapSeat(t,j){
  const s=S.sel;

  else { const a=S.teams[s.t].players, b=S.teams[t].players; [a[s.j],b[j]]=[b[j],a[s.j]]; S.sel=null; buzzV(20); toast("Intercambiados"); }

}
function removeSel(){ const s=S.sel; if(!s) return; S.teams[s.t].players.splice(s.j,1); S.sel=null; save(); render(); }
function moveSel(to){ const s=S.sel; if(!s) return; const [p]=S.teams[s.t].players.splice(s.j,1); S.teams[to].players.push(p); S.sel=null; save(); render(); }

function validate(){
  const c=S.config, err=[], n=allPlayers().length;
  if(n<4) err.push("Hacen falta al menos 4 jugadores.");
  else if(!S.drawn) err.push("Pulsa «Sortear equipos» para formar la mesa.");
  S.teams.forEach((t,i)=>{ if(t.players.length<2) err.push(`El equipo ${tName(i)} necesita al menos 2 jugadores.`); });
  if(n>MAX_PLAYERS) err.push(`Hay ${n} jugadores: el máximo es ${MAX_PLAYERS}.`);
  if(!c.rounds.some(r=>r.enabled)) err.push("Activa al menos una ronda.");
  if(!(+c.turnSeconds>=5&&+c.turnSeconds<=300)) err.push("El tiempo por turno tiene que estar entre 5 y 300 segundos.");
  if(!(+c.cardsTotal>=5)) err.push("Pon al menos 5 cartas en el mazo.");
  if(Math.floor(availableWords()/2)<+c.cardsTotal+20) err.push(`Con estas categorías y esta dificultad solo salen ${Math.floor(availableWords()/2)} cartas. Activa más categorías, cambia la dificultad o baja el número.`);
  return err;
}

/* ============ MAZO, MANOS, VOTO Y DESCARTES ============ */
function buildDeck(){
  const c=S.config, n=S.deckN||+c.cardsTotal;
  const pools=bankPools().map(p=>shuffle(p)).filter(p=>p.length);
  const own=ownCards().map(t=>({a:t,b:t,own:true}));
  const bankN=Math.max(0,n-own.length);
  const mk=(x,y)=>({a:x.t,ka:x.k,b:y.t,kb:y.k,own:false});
  let A=[],B=[],rest=[];
  if(c.dealMode==="equal"){
    const take=cnt=>{ const out=[]; let order=shuffle(pools.map((_,i)=>i)), i=0;
      while(out.length<cnt&&pools.some(p=>p.length)){ const p=pools[order[i]]; if(p.length) out.push(p.shift()); i++; if(i>=order.length){ i=0; order=shuffle(order); } }
      return out; };
    A=take(bankN); B=take(bankN); rest=shuffle(pools.flat());
  } else { const all=shuffle(pools.flat()); A=all.slice(0,bankN); B=all.slice(bankN,2*bankN); rest=all.slice(2*bankN); }
  const cards=[]; for(let i=0;i<Math.min(A.length,B.length);i++) cards.push(mk(A[i],B[i]));
  const extra=[]; for(let i=0;i+1<rest.length&&extra.length<600;i+=2) extra.push(mk(rest[i],rest[i+1]));
  let id=1; own.concat(cards,extra).forEach(x=>x.id=id++);
  S.deck=own.concat(cards); S.extra=extra;
  S.hands={}; const ps=handPlayers(); ps.forEach(p=>S.hands[p]=[]);
  cards.forEach((cd,i)=>S.hands[ps[i%ps.length]].push(cd.id));
}
function prepareDeck(){
  S.errors=validate();
  if(S.errors.length){ render(); setTimeout(()=>{ const e=$("errors"); if(e) e.scrollIntoView({behavior:"smooth",block:"center"}); },0); return; }
  ensureAudio(); S.vetoed=[]; S.written=[];
  if(+S.config.perPlayer>0){ S.writeIdx=0; S.writeRevealed=false; go("write"); return; }
  afterWrite();
}
function go(ph){ S.phase=ph; save(); render(); scrollTo(0,0); }
function handPlayers(){ return seats().map(s=>S.teams[s.t].players[s.j]); }
function afterWrite(){
  S.written=S.written||[];
  if(S.config.vetoOn){ S.vetoed=[]; S.vetoIdx=0; S.vetoRevealed=false; S.vetoMine=[]; go("veto"); return; }
  deal();
}
function deal(){
  const P=handPlayers().length, own=ownCards().length, n=+S.config.cardsTotal, bankN=Math.max(0,n-own);
  S.deckN=n;
  if(S.config.deckMode==="original"&&P&&bankN%P){
    const lo=Math.floor(bankN/P), hi=lo+1, nHi=bankN%P, m=S.config.handSplit;
    if(m==="ask"){
      openModal(mHead("Reparto desigual")+`<p>Con ${bankN} cartas y ${P} jugadores, <b>${nHi}</b> veríais ${hi} cartas y <b>${P-nHi}</b> veríais ${lo}.</p><p>¿Cómo lo hacemos?</p>
        <div class="menu"><button class="btn primary" onclick="chooseSplit('up')">${hi} cartas cada uno (mazo de ${own+hi*P})</button>
        ${lo>0?`<button class="btn" onclick="chooseSplit('down')">${lo} cartas cada uno (mazo de ${own+lo*P})</button>`:""}
        <button class="btn ghost" onclick="chooseSplit('keep')">Dejarlo así (mazo de ${n})</button></div>
        <p class="hint">Puedes dejarlo fijado en Normas, en «Si el reparto no es exacto».</p>`);
      return;
    }
    if(m==="up") S.deckN=own+hi*P; else if(m==="down"&&lo>0) S.deckN=own+lo*P;
  }
  dealNow();
}
function chooseSplit(m){
  const P=handPlayers().length, own=ownCards().length, n=+S.config.cardsTotal, bankN=Math.max(0,n-own), lo=Math.floor(bankN/P);
  S.deckN = m==="up"?own+(lo+1)*P : m==="down"?own+lo*P : n;
  closeModal(); dealNow();
}
function dealNow(){
  buildDeck(); S.face="a"; S.votes={a:0,b:0}; S.voteLog=[];
  if(S.config.deckMode==="random"){ allCards().forEach(c=>{ if(!c.own) c.f=Math.random()<.5?"a":"b"; }); startGame(); return; }
  S.handIdx=0; S.handRevealed=false; go("hands");
}
function afterHands(){
  if(!S.config.voteColor){ afterVote(); return; }
  if(S.config.voteWhen==="during"){
    const a=S.votes.a,b=S.votes.b; let f;
    if(a===b){ f=Math.random()<.5?"a":"b"; toast(`Empate a ${a}: decide el azar, cara ${faceName(f)}`); }
    else { f=a>b?"a":"b"; toast(`Gana la cara ${faceName(f)}, ${Math.max(a,b)} votos a ${Math.min(a,b)}`); }
    S.face=f; afterVote();
  } else go("vote");
}
function afterVote(){
  if(+S.config.discardRounds!==0){
    S.changesLeft={}; handPlayers().forEach(p=>S.changesLeft[p]=+S.config.discardRounds);
    S.handIdx=0; S.handRevealed=false; S.discardSel=[]; S.newIds=[]; go("discard");
  } else startGame();
}
/* quitar categorías */
function vetoLimit(){ const n=+S.config.vetoCount; return n===-1?Infinity:n; }
function wordsWithout(keys){ return BANK.filter(x=>S.config.cats[x.key]&&!keys.includes(x.key)).reduce((a,x)=>a+x.items.filter((t,i)=>S.config.difficulty==="all"||x.dif[i]===S.config.difficulty).length,0); }
function canVeto(k){
  const b=BANK.find(x=>x.key===k); if(b.adult&&!S.config.adultVetoable) return false;
  return wordsWithout([...S.vetoed,...S.vetoMine,k])>=(+S.config.cardsTotal)*2+60;
}
function vetoActive(){ return BANK.filter(b=>S.config.cats[b.key]&&!(S.locked&&b.adult)&&!S.vetoed.includes(b.key)); }
function toggleVeto(k){
  const secret=S.config.vetoMode==="secret", list=secret?S.vetoMine:S.vetoed, i=list.indexOf(k);
  if(i>=0){ list.splice(i,1); save(); render(); return; }
  const lim=secret?vetoLimit():vetoLimit()*allPlayers().length;
  if(list.length>=lim){ toast(lim===1?"Solo puedes quitar 1 categoría":`Máximo ${lim} categorías`); return; }
  const b=BANK.find(x=>x.key===k);
  if(!canVeto(k)){ toast(b.adult&&!S.config.adultVetoable?"El +18 no se puede quitar":"No se puede: quedarían muy pocas cartas"); return; }
  list.push(k); buzzV(20); save(); render();
}
function revealVeto(){ S.vetoRevealed=true; S.vetoMine=[]; save(); render(); scrollTo(0,0); }
function nextVeto(){
  S.vetoed.push(...S.vetoMine.filter(k=>!S.vetoed.includes(k))); S.vetoMine=[];
  S.vetoIdx++; S.vetoRevealed=false;
  if(S.vetoIdx>=allPlayers().length){ deal(); return; }
  save(); render(); scrollTo(0,0);
}
/* escribir cartas secretas */
function revealWrite(){ S.writeRevealed=true; save(); render(); setTimeout(()=>{ const x=$("w-0"); if(x) x.focus(); },0); }
function saveWrite(){
  const n=+S.config.perPlayer;
  for(let i=0;i<n;i++){ const v=($("w-"+i)?.value||"").trim(); if(v) S.written.push(v); }
  S.writeIdx++; S.writeRevealed=false;
  if(S.writeIdx>=allPlayers().length){ afterWrite(); return; }
  save(); render(); scrollTo(0,0);
}
/* ver la mano en privado */
function revealHand(){ S.handRevealed=true; save(); render(); scrollTo(0,0); }
function voteHand(f){ S.votes[f]++; buzzV(20); nextHand(); }
function nextHand(){
  S.handIdx++; S.handRevealed=false;
  if(S.handIdx>=handPlayers().length){ afterHands(); return; }
  save(); render(); scrollTo(0,0);
}
/* votación */
function vote(f){ S.votes[f]++; S.voteLog.push(f); buzzV(20); save(); render(); }
function undoVote(){ const f=S.voteLog.pop(); if(f) S.votes[f]--; save(); render(); }
function closeVote(random){
  let f;
  if(random||S.votes.a===S.votes.b){ f=Math.random()<.5?"a":"b"; if(!random) toast("Empate: decide el azar"); }
  else f=S.votes.a>S.votes.b?"a":"b";
  S.face=f; toast(`Jugáis con la cara ${faceName(f)}`); afterVote();
}
/* descartar */
function toggleDiscard(id){ const i=S.discardSel.indexOf(id); if(i<0) S.discardSel.push(id); else S.discardSel.splice(i,1); save(); render(); }
function doDiscard(){
  const p=handPlayers()[S.handIdx], h=S.hands[p];
  if(!S.discardSel.length){ toast("Toca primero las cartas que quieres cambiar"); return; }
  if(S.extra.length<S.discardSel.length){ toast("No quedan bastantes cartas de recambio"); return; }
  S.newIds=[];
  S.discardSel.forEach(id=>{ const k=h.indexOf(id); const nc=S.extra.shift(); S.deck=S.deck.filter(c=>c.id!==id); S.deck.push(nc); h[k]=nc.id; S.newIds.push(nc.id); });
  if(S.changesLeft[p]>0) S.changesLeft[p]--; S.discardSel=[]; buzzV(30);
  toast(S.changesLeft[p]===-1?"Cambiadas":S.changesLeft[p]>0?`Cambiadas. Te quedan ${S.changesLeft[p]} cambios`:"Cambiadas. Estas son tus cartas definitivas");
  save(); render();
}
function nextDiscard(){
  S.handIdx++; S.handRevealed=false; S.discardSel=[]; S.newIds=[];
  if(S.handIdx>=handPlayers().length){ startGame(); return; }
  save(); render(); scrollTo(0,0);
}

/* ============ PARTIDA ============ */
function startGame(){
  if(!S.deck.length){ toast("El mazo está vacío"); return; }
  S.rounds=S.config.rounds.filter(r=>r.enabled).map(r=>({...r}));
  S.scores=S.rounds.map(()=>S.teams.map(()=>0));
  S.roundIdx=0; S.teamTurn=0; S.history=[]; S.undo=[]; S.carry=0; S.turn=null; S.recorded=false;
  S.teams.forEach(t=>t.next=0);
  S.pool=shuffle(S.deck.map(c=>c.id));
  go("ready");
}
function currentPlayer(){ const t=team(S.teamTurn); return t.players[t.next%t.players.length]; }
const UNDO_KEYS=["phase","roundIdx","pool","teamTurn","scores","history","turn","carry","teams","endStep","awards","recorded"];
function pushUndo(){ const c={}; UNDO_KEYS.forEach(k=>c[k]=S[k]); S.undo.push(JSON.stringify(c)); if(S.undo.length>30) S.undo.shift(); }
function undoLast(skip){
  if(!S.undo||!S.undo.length){ toast("No hay ningún turno que deshacer"); return; }
  if(!skip&&!confirm("¿Deshacer el último turno? Se borran sus puntos y se vuelve a jugar.")) return;
  clearInterval(timer); keepAwake(false);
  const rest=S.undo.slice(0,-1); Object.assign(S,JSON.parse(S.undo[S.undo.length-1])); S.undo=rest;
  musicStop(); S.pool=shuffle(S.pool); // al repetir, las cartas salen en otro orden
  closeModal(); save(); render(); toast("Turno anulado: cartas barajadas de nuevo");
}
let timer=null, deadline=0, lastTap=0;
function startTurn(){
  ensureAudio(); keepAwake(true); pushUndo();
  const secs=S.carry||+S.config.turnSeconds;
  S.turn={team:S.teamTurn,player:currentPlayer(),queue:[...S.pool],guessed:[],passed:[],fouls:[],timeLeft:secs,total:+S.config.turnSeconds,paused:false,endedBy:null,review:null,lastT:secs,times:[]};
  S.carry=0; S.phase="turn";
  if(S.config.countdown){ S.turn.cdOn=true; S.turn.cd=3; save(); render(); runCountdown(); }
  else { save(); render(); runTimer(); }
}
function runCountdown(){
  const t=S.turn;
  const step=()=>{ if(S.phase!=="turn"||S.turn!==t||!t.cdOn) return;
    if(t.cd>0){ tone(t.cd===1?880:660,.14,"sine",.16); buzzV(25); const e=$("cdnum"); if(e){ e.textContent=t.cd; e.classList.remove("cdpop"); void e.offsetWidth; e.classList.add("cdpop"); } t.cd--; setTimeout(step,800); }
    else { t.cdOn=false; save(); render(); runTimer(); } };
  step();
}
function runTimer(){ clearInterval(timer); deadline=performance.now()+S.turn.timeLeft*1000; timer=setInterval(onTick,100); musicStart(); }
function onTick(){
  const t=S.turn; if(!t||S.phase!=="turn"||t.paused) return;
  const prev=Math.ceil(t.timeLeft);
  t.timeLeft=Math.max(0,(deadline-performance.now())/1000);
  const sec=Math.ceil(t.timeLeft);
  if(sec!==prev){ save(); if(sec<=5&&sec>0){ beep(); buzzV(15); } }
  paintTimer();
  if(t.timeLeft<=0) endTurn("time");
}
function paintTimer(){
  const t=S.turn; if(!t) return;
  const n=$("tnum"), d=$("drain"), sec=Math.ceil(t.timeLeft);
  if(n){ n.textContent=sec; n.classList.toggle("urgent",sec<=5); }
  if(d) d.style.height=Math.min(100,t.timeLeft/Math.max(t.total,t.timeLeft)*100)+"%";
}
function tooFast(){ const now=Date.now(); if(now-lastTap<280) return true; lastTap=now; return false; }
function hit(){
  const t=S.turn; if(S.phase!=="turn"||!t||t.paused||t.cdOn||tooFast()) return;
  t.acts=t.acts||[]; t.acts.push({k:"hit",lt:t.lastT}); const gid=t.queue.shift(); t.guessed.push(gid); t.times=t.times||[]; t.times.push({id:gid,dt:Math.max(0,(t.lastT??t.timeLeft)-t.timeLeft),tl:t.timeLeft}); t.lastT=t.timeLeft; ding(); buzzV(30);
  if(!t.queue.length){ endTurn("empty"); return; }
  save(); render();
}
function pass(){
  const t=S.turn; if(S.phase!=="turn"||!t||t.paused||t.cdOn) return;
  if(!S.rounds[S.roundIdx].allowPass){ toast("En esta ronda no se puede pasar"); return; }
  if(tooFast()) return;
  if(t.queue.length<2){ toast("Es la última carta"); return; }
  const id=t.queue.shift(); t.queue.push(id); t.acts=t.acts||[]; t.acts.push({k:"pass",lt:t.lastT,nw:!t.passed.includes(id)}); if(!t.passed.includes(id)) t.passed.push(id); t.lastT=t.timeLeft;
  buzzV(15); save(); render();
}
function foul(){
  const t=S.turn; if(S.phase!=="turn"||!t||t.paused||t.cdOn||tooFast()) return;
  const id=t.queue.shift(); t.queue.push(id); t.acts=t.acts||[]; t.acts.push({k:"foul",lt:t.lastT}); t.fouls.push(id); t.lastT=t.timeLeft;
  tone(220,.25,"square",.1); buzzV([40,40,40]);
  if(S.rounds[S.roundIdx].foulEnds){ endTurn("foul"); return; }
  toast("Falta: la carta vuelve al mazo"); save(); render();
}
function undoTap(){
  const t=S.turn; if(S.phase!=="turn"||!t||t.paused||t.cdOn) return;
  const a=(t.acts||[]).pop(); if(!a){ toast("No hay nada que deshacer"); return; }
  if(a.k==="hit"){ const id=t.guessed.pop(); t.times.pop(); t.queue.unshift(id); toast("Acierto deshecho"); }
  else { const id=t.queue.pop(); t.queue.unshift(id); if(a.k==="pass"&&a.nw) t.passed.pop(); if(a.k==="foul") t.fouls.pop(); toast(a.k==="pass"?"Pase deshecho":"Falta deshecha"); }
  t.lastT=a.lt; buzzV(20); save(); render();
}
function togglePause(){
  const t=S.turn; if(!t||t.cdOn) return;
  if(!t.paused){ t.timeLeft=Math.max(0,(deadline-performance.now())/1000); t.paused=true; clearInterval(timer); musicStop(); }
  else { t.paused=false; t.recovered=false; runTimer(); }
  save(); render();
}
function endNow(){ const t=S.turn; if(!t) return; t.paused=false; endTurn("time"); }
function endTurn(reason){
  if(S.phase!=="turn") return;
  clearInterval(timer); keepAwake(false);
  musicStop(); const t=S.turn; t.endedBy=reason; t.paused=false;
  t.review=t.guessed.map(id=>({id,ok:true}));
  if(reason==="time"&&t.queue.length) t.review.push({id:t.queue[0],ok:false,buzzer:true});
  if(reason==="empty"){ ding(); speak("¡Se acabaron las cartas!"); } else { buzz(); buzzV([200,80,200]); speak(reason==="foul"?"¡Falta!":"¡Tiempo!"); }
  go("review");
}
function toggleReview(k){ const r=S.turn.review[k]; r.ok=!r.ok; save(); render(); }
function rotate(){ const t=team(S.teamTurn); t.next=(t.next+1)%t.players.length; S.teamTurn=(S.teamTurn+1)%S.teams.length; }
function confirmReview(){
  const t=S.turn, okSet=new Set(t.review.filter(r=>r.ok).map(r=>r.id));
  const back=t.review.filter(r=>!r.ok&&!t.queue.includes(r.id)).map(r=>r.id);
  S.pool=t.queue.filter(id=>!okSet.has(id)).concat(back);
  S.scores[S.roundIdx][t.team]+=okSet.size*(+S.config.pointsPerCard||1);
  S.history.push({round:S.roundIdx,team:t.team,player:t.player,ok:[...okSet],passed:t.passed.length,fouls:t.fouls.length,times:(t.times||[]).filter(x=>okSet.has(x.id)),passIds:t.passed.slice(),foulIds:t.fouls.slice()});
  const done=S.pool.length===0, last=S.roundIdx>=S.rounds.length-1, left=Math.floor(t.timeLeft);
  if(done){
    if(!last&&S.config.carryOver&&t.endedBy==="empty"&&left>=3) S.carry=left; else { S.carry=0; rotate(); }
    S.phase=last?"end":"roundEnd";
    if(last){ S.endStep=0; S.awards=computeAwards(); recordGame(); }
  } else { S.carry=0; rotate(); S.phase="ready"; }
  S.turn=null; save(); render(); scrollTo(0,0);
}
function nextRound(){ if(S.config.reviewBetween){ S.repasoLeft=+S.config.reviewSecs; S.repasoOrder=shuffle(S.deck.map(c=>c.id)); go("repaso"); } else doNextRound(); }
function doNextRound(){ clearInterval(repasoTimer); repasoTimer=null; S.roundIdx++; S.pool=shuffle(S.deck.map(c=>c.id)); go("ready"); }
let repasoTimer=null;
function runRepaso(){ if(repasoTimer) return; repasoTimer=setInterval(()=>{ if(S.phase!=="repaso"){ clearInterval(repasoTimer); repasoTimer=null; return; } S.repasoLeft--; const e=$("rpnum"); if(e) e.textContent=Math.max(0,S.repasoLeft); if(S.repasoLeft<=3&&S.repasoLeft>0) beep(); if(S.repasoLeft<=0){ buzz(); doNextRound(); } else save(); },1000); }
function vRepaso(){

    <div class="bottombar"><button class="btn primary big" onclick="doNextRound()">Empezar la ronda ya</button></div></main>`;
}
function totals(){ return S.teams.map((_,i)=>S.scores.reduce((a,r)=>a+(r[i]||0),0)); }
function rematch(){ S.history=[]; S.undo=[]; closeModal(); prepareDeck(); }
function backToSetup(){
  if(S.locked&&S.phase==="end"){ closeModal(); clearClass(); render(); scrollTo(0,0); return; }
  if(!["setup","end"].includes(S.phase)&&!confirm("¿Volver a la configuración? Se abandona la partida (jugadores y ajustes se mantienen).")) return;

function fullscreen(){ try{ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }catch(e){ toast("Este navegador no permite pantalla completa"); } closeModal(); }
function toggleOpt(k,l){ S.config[k]=!S.config[k]; ensureAudio(); save(); showMenu(); updateAmbient(); toast(`${l}: ${S.config[k]?"sí":"no"}`); }

function showRules(){
  const c=S.config, rs=S.rounds.length?S.rounds:c.rounds.filter(r=>r.enabled);

function computeAwards(){
  const H=S.history, P={}, A=[];
  H.forEach(h=>{ const k=h.player+"|"+h.team; P[k]=P[k]||{n:h.player,t:h.team,ok:0,turns:0,fouls:0,passes:0}; const p=P[k]; p.ok+=h.ok.length; p.turns++; p.fouls+=h.fouls||0; p.passes+=h.passed||0; });
  const ps=Object.values(P); if(!ps.length) return A;
  const top=(arr,f)=>arr.reduce((a,b)=>f(b)>f(a)?b:a);
  const bd=top(ps,p=>p.ok); A.push({e:"🎯",t:"Mejor descriptor",w:bd.n,team:bd.t,d:`${bd.ok} cartas acertadas describiendo`});
  const bt=top(H,h=>h.ok.length); A.push({e:"🚀",t:"El turno de la noche",w:bt.player,team:bt.team,d:`${bt.ok.length} cartas en un solo turno, en la ronda ${bt.round+1}`});
  const times=H.flatMap(h=>(h.times||[]).map(x=>({...x,player:h.player,team:h.team})));
  const fast=times.filter(x=>x.dt>=.3);
  if(fast.length){ const b=fast.reduce((a,c)=>c.dt<a.dt?c:a); A.push({e:"⚡",t:"Acierto relámpago",w:b.player,team:b.team,d:`«${word(card(b.id))}» acertada en ${b.dt.toFixed(1)} segundos`}); }
  if(times.length){ const b=times.reduce((a,c)=>c.dt>a.dt?c:a); A.push({e:"🐢",t:"La carta que más costó",w:word(card(b.id)),isCard:true,d:`${b.dt.toFixed(1)} segundos hasta que salió, describiendo ${b.player}`}); }
  const cnt={}; H.forEach(h=>[...(h.passIds||[]),...(h.foulIds||[])].forEach(id=>cnt[id]=(cnt[id]||0)+1));
  const cur=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  if(cur&&cur[1]>=2) A.push({e:"🧟",t:"La carta maldita",w:word(card(+cur[0])),isCard:true,d:`Pasada o con falta ${cur[1]} veces`});
  const f=ps.filter(p=>p.fouls>0); if(f.length){ const b=top(f,p=>p.fouls); A.push({e:"🙊",t:"Coleccionista de faltas",w:b.n,team:b.t,d:`${b.fouls} falta${b.fouls===1?"":"s"} en toda la partida`}); }
  const pa=ps.filter(p=>p.passes>0); if(pa.length){ const b=top(pa,p=>p.passes); A.push({e:"🙈",t:"Pasa de todo",w:b.n,team:b.t,d:`${b.passes} carta${b.passes===1?"":"s"} pasada${b.passes===1?"":"s"}`}); }
  if(ps.length>1){ const b=ps.reduce((a,c)=>(c.ok/c.turns)<(a.ok/a.turns)?c:a); if(b!==bd) A.push({e:"🐌",t:"Se lo ha tomado con calma",w:b.n,team:b.t,d:`${(b.ok/b.turns).toFixed(1)} cartas por turno de media`}); }
  if(S.rounds.length>1){
    const r1=S.scores[0], tot=totals(), m1=Math.max(...r1), mt=Math.max(...tot);
    const l1=r1.map((v,i)=>i).filter(i=>r1[i]===m1), wn=tot.map((v,i)=>i).filter(i=>tot[i]===mt);
    if(wn.length===1&&!l1.includes(wn[0])) A.push({e:"🔥",t:"Remontada épica",w:tName(wn[0]),isTeam:true,d:"Iban por detrás después de la primera ronda"});
  }
  const pick=["🎯","🚀","⚡","🧟","🐢","🙊","🔥"], out=[];
  pick.forEach(e=>{ const a=A.find(x=>x.e===e); if(a&&out.length<5) out.push(a); });
  if(out.some(x=>x.e==="🧟")) { const k=out.findIndex(x=>x.e==="🐢"); if(k>=0) out.splice(k,1); }
  const rem=A.find(x=>x.e==="🔥"); if(rem&&!out.includes(rem)){ out.pop(); out.push(rem); }
  return out;
}
function statTiles(){
  const H=S.history; if(!H.length) return "";
  const ok=H.reduce((a,h)=>a+h.ok.length,0), fouls=H.reduce((a,h)=>a+(h.fouls||0),0), passes=H.reduce((a,h)=>a+(h.passed||0),0);
  const times=H.flatMap(h=>h.times||[]), avg=times.length?times.reduce((a,x)=>a+x.dt,0)/times.length:0;
  const late=times.filter(x=>x.tl!==undefined&&x.tl<=5).length;
  const byR=S.rounds.map((r,k)=>{ const ts=H.filter(h=>h.round===k).flatMap(h=>h.times||[]); return {r,n:ts.length,a:ts.length?ts.reduce((s,x)=>s+x.dt,0)/ts.length:Infinity}; }).filter(x=>x.n);
  const fastR=byR.length?byR.reduce((a,b)=>b.a<a.a?b:a):null, slowR=byR.length?byR.reduce((a,b)=>b.a>a.a?b:a):null;
  const eff=S.teams.map((t,i)=>{ const hs=H.filter(h=>h.team===i); return {i,v:hs.length?hs.reduce((a,h)=>a+h.ok.length,0)/hs.length:0}; }).reduce((a,b)=>b.v>a.v?b:a);

  const tiles=[

    ["⏱️",avg?avg.toFixed(1)+" s":"–","de media por carta"],
    fastR?["🏎️",esc(fastR.r.name),`la ronda más rápida (${fastR.a.toFixed(1)} s por carta)`]:null,

    ["💯",tEmoji(eff.i)+" "+eff.v.toFixed(1),`cartas por turno, el equipo más eficaz`],

  return `<h3 class="mini-h">La partida en números</h3><div class="stiles">${tiles.map(([e,v,l])=>`<div class="stile"><span>${e}</span><b>${v}</b><small>${l}</small></div>`).join("")}</div>`;
}

}
function drumroll(sec){ if(!S.config.sound) return; ensureAudio(); if(!actx) return; const t0=actx.currentTime; const n=Math.floor(sec/.055); for(let i=0;i<n;i++) noiseHit(t0+i*.055,.08+.25*i/n); }

  const cols=["#f2b705","#2f7de1","#e5484d","#2f9e5b","#8e4ec6","#f76b15","#ffffff"];
  const P=Array.from({length:180},()=>({x:Math.random()*W,y:-20-Math.random()*H*.6,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,s:5+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  const step=now=>{ ctx.clearRect(0,0,W,H); const fade=Math.max(0,1-(now-t0-ms+800)/800);
    P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.04; p.r+=p.vr; ctx.save(); ctx.globalAlpha=fade; ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); });
    if(now-t0<ms) confettiRAF=requestAnimationFrame(step); else stopConfetti(); };
  confettiRAF=requestAnimationFrame(step);
}
let lastPhase=null;
function render(){
  const v={repaso:vRepaso,setup:vSetup,write:vWrite,veto:vVeto,hands:vHands,vote:vVote,discard:vDiscard,ready:vReady,turn:vTurn,review:vReview,roundEnd:vRoundEnd,end:vEnd}[S.phase]||vSetup;
  fxToken++; stopConfetti();
  $("app").innerHTML=v();
  if(S.phase!==lastPhase){ const a=$("app"); a.classList.remove("enter"); void a.offsetWidth; if(S.phase!=="turn") a.classList.add("enter"); lastPhase=S.phase; }
  if(S.phase==="turn") paintTimer();
  if(S.phase==="end") endFx(fxToken);
  if(S.phase==="repaso") runRepaso();
  applyCA($("app"));
  updateAmbient();
  splash();
  if(S.phase==="ready"&&started){ const key=S.roundIdx+"-"+S.history.length; if(key!==lastSpoken){ lastSpoken=key; const tm=team(S.teamTurn); setTimeout(()=>speak(`Le toca a ${currentPlayer()}, de los ${an(tm.animal)}`),250); } }
}
document.addEventListener("keydown",e=>{
  const tag=(e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea"||tag==="select") return;
  if($("modal").innerHTML){ if(e.key==="Escape") closeModal(); return; }
  if(S.phase==="turn"){
    if(e.key===" "||e.key==="Enter"){ e.preventDefault(); if(S.turn.paused) togglePause(); else hit(); }
    else if(e.key==="p"||e.key==="P"){ e.preventDefault(); pass(); }
    else if(e.key==="f"||e.key==="F"){ e.preventDefault(); foul(); }
    else if(e.key==="z"||e.key==="Z"||e.key==="Backspace"){ e.preventDefault(); undoTap(); }
    else if(e.key==="Escape"){ e.preventDefault(); togglePause(); }
  } else if(S.phase==="ready"&&e.key==="Enter"){ e.preventDefault(); startTurn(); }
});
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){ if(S.phase==="turn"&&S.turn&&!S.turn.paused&&!S.turn.cdOn) togglePause(); save(); }
  else { if(started) keepAwake(); if(S.phase==="turn"&&S.turn&&S.turn.paused) toast("Turno en pausa: pulsa Seguir cuando estéis listos"); }
});
const inGameNow=()=>!["setup","end"].includes(S.phase);
window.addEventListener("beforeunload",e=>{ save(); if(inGameNow()){ e.preventDefault(); e.returnValue=""; } });
window.addEventListener("pagehide",()=>save());
window.addEventListener("popstate",()=>{ try{ history.pushState({tu:1},""); }catch(e){} if(S.phase==="turn"&&S.turn&&!S.turn.paused&&!S.turn.cdOn) togglePause(); if(inGameNow()) toast("Para salir de la partida, usa el menú ☰"); });
document.addEventListener("contextmenu",e=>{ const tag=(e.target.tagName||"").toLowerCase(); if(tag!=="input"&&tag!=="textarea") e.preventDefault(); });
window.addEventListener("storage",e=>{ if(e.key===KEY&&e.newValue&&!$("othertab")){ const d=document.createElement("div"); d.id="othertab"; d.className="overlay"; d.innerHTML=`<div class="modal" role="alertdialog"><h2>⚠️ Abierto en otra pestaña</h2><p>Este juego también está abierto en otra pestaña o ventana de este dispositivo y los cambios se están mezclando. Usadlo solo en una.</p><div class="menu"><button class="btn primary" onclick="useThisTab()">Seguir en esta pestaña</button></div></div>`; document.body.appendChild(d); if(S.phase==="turn"&&S.turn&&!S.turn.paused) togglePause(); } });
function useThisTab(){ const l=load(); if(l) S=l; const d=$("othertab"); if(d) d.remove(); save(); render(); }
if(S.locked&&(classExpired()||S.phase==="end")) clearClass();
if(/^c[A-Za-z0-9_-]{15,}$/.test(HASH_CODE)&&decodeCode(HASH_CODE)){ if(!S.locked||S.locked.code!==HASH_CODE.slice(1)){ S.pendingJoin=HASH_CODE.slice(1); save(); } }
render();

</script>
